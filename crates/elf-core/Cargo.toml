[package]
name = "elf-core"
version = "0.1.0"
edition = "2021"
description = "Business logic core of the Elf desktop assistant (no Tauri / Windows dependencies)"
publish = false

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.20"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
