[package]
name = "elf-core"
version = "0.1.0"
edition = "2021"
description = "Business logic core of the Elf desktop assistant (no Tauri / Windows dependencies)"
publish = false

[features]
default = ["http-client"]
# Real HTTPS transport (reqwest + rustls with the ring provider; no OpenSSL).
http-client = ["dep:reqwest", "dep:rustls"]

[dependencies]
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
futures = "0.3.34"
jsonschema = { version = "0.61.1", default-features = false }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.20"
url = "2"
uuid = { version = "1.29.2", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["net", "io-util"] }
