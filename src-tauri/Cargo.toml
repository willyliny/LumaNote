[package]
name = "elf-shell"
version = "0.1.0"
description = "Tauri shell of the Elf desktop assistant (windows, tray, IPC glue only)"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "elf_shell_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.5"
serde = { version = "1", features = ["derive"] }
# Business logic crate. Not called yet in this slice (it exports no version constant);
# linked so the first build also proves the bundled SQLite C build works on this machine.
elf-core = { path = "../crates/elf-core" }
